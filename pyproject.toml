[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "mcp-advanced-excel"
version = "0.1.0"
description = "Stdio MCP server that normalizes messy lab and instrument Excel and CSV exports."
readme = "README.md"
license = { text = "MIT" }
requires-python = ">=3.11"
authors = [
  { name = "Antonio Castellon", email = "hello@castellon.ch" },
]
keywords = ["mcp", "excel", "csv", "laboratory", "openpyxl", "stdio"]
classifiers = [
  "Development Status :: 3 - Alpha",
  "Intended Audience :: Developers",
  "Intended Audience :: Science/Research",
  "License :: OSI Approved :: MIT License",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3.11",
  "Programming Language :: Python :: 3.12",
  "Programming Language :: Python :: 3.13",
  "Topic :: Scientific/Engineering :: Information Analysis",
]
dependencies = [
  # Floor is the first 1.x release that fixes GHSA-84m7-p3x7-pcfv
  # (CVE-2026-59951). 2.0.0 through 2.1.1 are also affected, so stay on 1.x.
  "mcp>=1.30.0,<2",
  "openpyxl>=3.1.2,<4",
  "xlrd>=2.0.1,<3",
]

[project.optional-dependencies]
dev = [
  "pytest>=8",
  "ruff>=0.9",
  "xlwt>=1.3",
]

[project.scripts]
mcp-advanced-excel = "mcp_advanced_excel.__main__:main"

[project.urls]
Homepage = "https://github.com/antonio-castellon/mcp-advanced-excel"
Issues = "https://github.com/antonio-castellon/mcp-advanced-excel/issues"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]

[tool.ruff]
line-length = 100
target-version = "py311"
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]

[tool.ruff.lint.per-file-ignores]
"tests/*" = ["E501"]
