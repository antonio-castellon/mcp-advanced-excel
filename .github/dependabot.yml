version: 2
updates:
  - package-ecosystem: uv
    directory: "/"
    schedule:
      interval: weekly
    ignore:
      # Major mcp releases change the SDK API. Upgrade them in a planned PR.
      - dependency-name: "mcp"
        update-types: ["version-update:semver-major"]
  - package-ecosystem: github-actions
    directory: "/"
    schedule:
      interval: weekly
