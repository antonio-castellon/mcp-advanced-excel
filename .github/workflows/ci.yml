name: CI

on:
  push:
    branches: [main]
    # Same as paths-ignore for "**/*.md", "docs/**", and LICENSE, except that
    # README.md and docs/*.md still run CI: tests/test_package.py checks them.
    # paths-ignore cannot re-include files, so this uses paths with "!".
    paths:
      - "**"
      - "!**/*.md"
      - "!docs/**"
      - "!LICENSE"
      - "README.md"
      - "docs/*.md"
  pull_request:
    # Same as paths-ignore for "**/*.md", "docs/**", and LICENSE, except that
    # README.md and docs/*.md still run CI: tests/test_package.py checks them.
    # paths-ignore cannot re-include files, so this uses paths with "!".
    paths:
      - "**"
      - "!**/*.md"
      - "!docs/**"
      - "!LICENSE"
      - "README.md"
      - "docs/*.md"

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: astral-sh/setup-uv@07a047e608db84b3d8c06cd9a7c7dcc9c355c18e # v10.3.2
        with:
          version: "0.13.6"
          python-version: "3.12"
          enable-cache: true
      - run: uv sync --frozen --extra dev --python 3.12
      - name: Ruff
        run: |
          uv run ruff check src tests
          uv run ruff format --check src tests

  test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        # Full matrix on pull requests; pushes to main run 3.12 only.
        python-version: ${{ fromJSON(github.event_name == 'pull_request' && '["3.11", "3.12", "3.13"]' || '["3.12"]') }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: astral-sh/setup-uv@07a047e608db84b3d8c06cd9a7c7dcc9c355c18e # v10.3.2
        with:
          version: "0.13.6"
          python-version: ${{ matrix.python-version }}
          enable-cache: true
      - run: uv sync --frozen --extra dev --python ${{ matrix.python-version }}
      - run: uv run pytest

  audit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: astral-sh/setup-uv@07a047e608db84b3d8c06cd9a7c7dcc9c355c18e # v10.3.2
        with:
          version: "0.13.6"
          python-version: "3.12"
          enable-cache: true
      - run: uv sync --frozen --extra dev --python 3.12
      - name: Audit locked dependencies
        run: |
          uv export --frozen --extra dev --no-emit-project --format requirements-txt -o /tmp/requirements-audit.txt
          uv run pip-audit --requirement /tmp/requirements-audit.txt --disable-pip --require-hashes --progress-spinner off
